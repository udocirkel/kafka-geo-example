# --------------------------------------------------
# MirrorMaker 2 - Failover replication (DC2 --> DC1)
# --------------------------------------------------

# Existing clusters
clusters=dc1,dc2

# Bootstrap servers
dc1.bootstrap.servers=kafka-dc1.internal:9092
dc2.bootstrap.servers=kafka-dc2.internal:9092

# Enable only replication flow DC2 --> DC1 (prevents loops)
dc2->dc1.enabled=true
dc1->dc2.enabled=false
sync.group.offsets.enabled=true

# Select all topics and groups for replication (regex)
dc2->dc1.topics=.*
dc2->dc1.groups=.*
dc2->dc1.replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy

# Replication factor for mirrored topics
dc2->dc1.replication.factor=3

# Enable automatic topic discovery
dc2->dc1.refresh.topics.enabled=true
dc2->dc1.refresh.topics.interval.seconds=10

# Enable offset and heartbeat replication
dc2->dc1.emit.checkpoints.enabled=true
dc2->dc1.emit.heartbeats.enabled=true
