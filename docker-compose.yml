      - kafka-dc2

  #######################################################################
  ###  Data Center 1 (DC1) - Mirror Maker 2 (single worker for demo)  ###
  #######################################################################

  mirrormaker-dc1:
    # depends on kafka*-dc1, kafka*-dc2
    image: apache/kafka:4.1.1
    restart: on-failure:5
    environment:
      # Kafka Connect worker runs in DC1
      CONNECT_BOOTSTRAP_SERVERS: "kafka-dc2.internal"
      CONNECT_GROUP_ID: "mm2-dc2-group"
      # Internal Connect topics (must be replicated)
      CONNECT_CONFIG_STORAGE_TOPIC: __mm2_configs
      CONNECT_OFFSET_STORAGE_TOPIC: __mm2_offsets
      CONNECT_STATUS_STORAGE_TOPIC: __mm2_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
    command: >
      bash -c "
      /opt/kafka/bin/connect-mirror-maker.sh /opt/mm2.properties
      "
    healthcheck:
      test: [ "CMD-SHELL", "grep -q 'Kafka MirrorMaker started' /opt/kafka/logs/connect.log" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./config/mm2-dc2-to-dc1.properties:/opt/mm2.properties
    networks: [ dc1, dc2 ]
    profiles:
      - site-dc1
      - repl-dc2-to-dc1

  #######################################################################
  ###  Data Center 2 (DC2) - Mirror Maker 2 (single worker for demo)  ###
  #######################################################################

  mirrormaker-dc2:
    # depends on kafka*-dc1, kafka*-dc2
    image: apache/kafka:4.1.1
    restart: on-failure:5
    environment:
      # Kafka Connect worker runs in DC2
      CONNECT_BOOTSTRAP_SERVERS: "kafka-dc1.internal"
      CONNECT_GROUP_ID: "mm2-dc1-group"
      # Internal Connect topics (must be replicated)
      CONNECT_CONFIG_STORAGE_TOPIC: __mm2_configs
      CONNECT_OFFSET_STORAGE_TOPIC: __mm2_offsets
      CONNECT_STATUS_STORAGE_TOPIC: __mm2_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
    command: >
      bash -c "
      /opt/kafka/bin/connect-mirror-maker.sh /opt/mm2.properties
      "
    healthcheck:
      test: [ "CMD-SHELL", "grep -q 'Kafka MirrorMaker started' /opt/kafka/logs/connect.log" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./config/mm2-dc1-to-dc2.properties:/opt/mm2.properties
    networks: [ dc1, dc2 ]
    profiles:
      - site-dc2
      - repl-dc1-to-dc2

  ##############################
  ###  Kafka Console (AKHQ)  ###
  ##############################

  akhq:
    # depends on kafka*-dc1, kafka*-dc2
    image: tchiotludo/akhq:0.26.0
    restart: always
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            dc1:
              properties:
                bootstrap.servers: "kafka-dc1.internal:9092"
            dc2:
              properties:
                bootstrap.servers: "kafka-dc2.internal:9092"
    ports:
      - "8081:8080"
    networks: [ dc1, dc2 ]
    profiles:
      - site-dc1
      - site-dc2
      - kafka-ui

  #############################################
  ###  Data Center 1 (DC1) - Demo Services  ###
  #############################################

  demo-service-dc1:
    image: udocirkel/kafka-example/demo-service:1.0.0
    restart: always
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-dc1.internal:9092
      APP_TOPIC_NAME: demo-topic
      APP_TOPIC_NAME_TX: demo-topic-tx
      APP_TOPIC_PARTITIONS: 4
      APP_TOPIC_REPLICAS: 3
      APP_TOPIC_MIN_INSYNC_REPLICAS: 2
      LOG_LEVEL: DEBUG
    healthcheck:
      test: ["CMD", "curl", "--http1.1", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    ports:
      - "8087:8080"
    networks: [ dc1 ]
    profiles:
      - site-dc1
      - apps-dc1

  #############################################
  ###  Data Center 2 (DC2) - Demo Services  ###
  #############################################

  demo-service-dc2:
    image: udocirkel/kafka-example/demo-service:1.0.0
